name: Feature request
description: Propose a focused improvement to Pipa.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the smallest useful behavior and relevant alternatives.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Data and security considerations
      description: Note any new network access, persistence, credentials or destructive operations.
