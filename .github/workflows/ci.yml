name: 持续集成

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 前端、Rust 与 MySQL 集成验证
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env:
          MYSQL_DATABASE: pipa_test
          MYSQL_USER: pipa
          MYSQL_PASSWORD: pipa_test_password
          MYSQL_ROOT_PASSWORD: pipa_test_root_password
        ports:
          - 33306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent -h 127.0.0.1 -ppipa_test_root_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: 检出完整历史
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 安装 pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.5.2

      - name: 安装 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy,rustfmt

      - name: 恢复 Rust 构建缓存
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: 安装 Linux Tauri 依赖
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: 按锁文件安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 校验第三方许可证声明
        run: pnpm licenses:check

      - name: 测试并构建前端
        run: |
          pnpm test
          pnpm build

      - name: 校验 Rust 格式
        run: cargo fmt --all -- --check

      - name: 测试 Rust 工作区与 MySQL 适配器
        run: cargo test --workspace --locked

      - name: 拒绝生成的 TypeScript 绑定漂移
        run: |
          pnpm bindings:format
          git diff --exit-code -- src/bindings

      - name: 检查所有 Rust 目标
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: 拒绝意外的仓库改动
        run: git diff --exit-code
