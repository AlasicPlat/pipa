[package]
name = "pipa-app"
version = "0.2.8"
description = "Pipa desktop database client"
edition = "2021"
authors.workspace = true
license.workspace = true
repository.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pipa_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true, features = [] }

[dependencies]
axum.workspace = true
base64.workspace = true
chrono.workspace = true
getrandom.workspace = true
http.workspace = true
libc.workspace = true
pipa-core = { path = "../crates/pipa-core" }
pipa-binlog = { path = "../crates/pipa-binlog" }
pipa-mysql = { path = "../crates/pipa-mysql" }
pipa-redis = { path = "../crates/pipa-redis" }
pipa-store = { path = "../crates/pipa-store" }
rmcp.workspace = true
rusqlite.workspace = true
schemars.workspace = true
secrecy.workspace = true
tauri = { workspace = true, features = [] }
tauri-plugin-clipboard-manager.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-process.workspace = true
tauri-plugin-updater.workspace = true
tempfile.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower.workspace = true
tower-http.workspace = true
uuid.workspace = true
zeroize.workspace = true
