[workspace]
members = ["crates/pipa-core", "crates/pipa-mysql", "crates/pipa-store", "src-tauri"]
resolver = "2"

[workspace.dependencies]
async-trait = "0.1.89"
base64 = "0.22.1"
bigdecimal = "0.4.10"
chrono = { version = "0.4.45", features = ["serde"] }
futures-util = "0.3.32"
getrandom = "0.3.4"
keyring = "4.1.4"
rusqlite = { version = "0.40.1", features = ["bundled-sqlcipher-vendored-openssl", "chrono", "uuid"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlx-core = { version = "=0.9.0", default-features = false, features = ["_rt-tokio", "_tls-rustls-ring-native-roots"] }
sqlx-mysql = { version = "=0.9.0", default-features = false, features = ["rsa", "chrono", "bigdecimal", "json", "uuid"] }
tauri = "2.11.5"
tauri-build = "2.6.3"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
ts-rs = { version = "12.0.1", features = ["uuid-impl", "serde-json-impl"] }
uuid = { version = "1.23.4", features = ["v4", "serde"] }
zeroize = "1.9.0"
