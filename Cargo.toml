[workspace]
members = ["crates/pipa-binlog", "crates/pipa-core", "crates/pipa-mysql", "crates/pipa-redis", "crates/pipa-store", "src-tauri"]
resolver = "2"

[workspace.package]
authors = ["Alasic333 <129958248+AlasicPlat@users.noreply.github.com>"]
license = "Apache-2.0"
repository = "https://github.com/AlasicPlat/pipa"

[workspace.dependencies]
async-trait = "0.1.89"
axum = "0.8.8"
base64 = "0.22.1"
bigdecimal = "0.4.10"
chrono = { version = "0.4.45", features = ["serde"] }
futures-util = "0.3.32"
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
getrandom = "0.3.4"
http = "1.4.0"
libc = "0.2.186"
mysql_common = { version = "0.37.3", default-features = false, features = ["binlog"] }
rmcp = { version = "2.2.0", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
regex = "1.13.0"
rusqlite = { version = "0.40.1", features = ["bundled-sqlcipher-vendored-openssl", "chrono", "uuid"] }
schemars = "1.2.1"
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlx-core = { version = "=0.9.0", default-features = false, features = ["_rt-tokio", "_tls-rustls-ring-native-roots"] }
sqlx-mysql = { version = "=0.9.0", default-features = false, features = ["rsa", "chrono", "bigdecimal", "json", "uuid"] }
tauri = "2.11.5"
tauri-build = "2.6.3"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
tower = "0.5.2"
tower-http = { version = "0.6.8", features = ["limit"] }
ts-rs = { version = "12.0.1", features = ["uuid-impl", "serde-json-impl"] }
uuid = { version = "1.23.4", features = ["v4", "serde"] }
zeroize = "1.9.0"
